<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>五子棋</h1>
            <p class="subtitle">Gomoku</p>
        </header>

        <main>
            <div class="board-wrapper">
                <canvas id="board">您的浏览器不支持 Canvas</canvas>
            </div>

            <aside class="panel">
                <div class="panel-section">
                    <div class="status" id="status">黑棋落子</div>
                    <div class="score-row">
                        <div class="score black-score">
                            <span class="score-piece black"></span>
                            <span class="score-label">黑</span>
                            <span class="score-value" id="blackScore">0</span>
                        </div>
                        <div class="score white-score">
                            <span class="score-label">白</span>
                            <span class="score-piece white"></span>
                            <span class="score-value" id="whiteScore">0</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <label class="setting-label">对手</label>
                    <div class="toggle-group" id="opponentToggle">
                        <button class="toggle-btn active" data-value="ai">AI</button>
                        <button class="toggle-btn" data-value="friend">好友</button>
                    </div>
                </div>

                <div class="panel-section" id="difficultySection">
                    <label class="setting-label">难度</label>
                    <div class="toggle-group" id="difficultyToggle">
                        <button class="toggle-btn" data-value="easy">简单</button>
                        <button class="toggle-btn active" data-value="medium">中等</button>
                        <button class="toggle-btn" data-value="hard">困难</button>
                    </div>
                </div>

                <div class="panel-section">
                    <label class="setting-label">执棋</label>
                    <div class="toggle-group" id="colorToggle">
                        <button class="toggle-btn active" data-value="black">执黑（先手）</button>
                        <button class="toggle-btn" data-value="white">执白（后手）</button>
                    </div>
                </div>

                <div class="panel-actions">
                    <button class="btn btn-primary" id="newGameBtn">新游戏</button>
                    <button class="btn btn-secondary" id="undoBtn">悔棋</button>
                </div>
            </aside>
        </main>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <h2 class="modal-title" id="modalTitle">你赢了！</h2>
            <p class="modal-desc" id="modalDesc">恭喜！</p>
            <button class="btn btn-primary" id="modalBtn">再来一局</button>
        </div>
    </div>

    <script src="js/game.js"></script>
    <script src="js/board.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
