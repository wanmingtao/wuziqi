<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>弹球消消乐</title>
  <link rel="stylesheet" href="css/bubblepop.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
  <div class="hud">
    <div class="hud-item"><span class="hud-label">分数</span><span class="hud-value" id="scoreDisplay">0</span></div>
    <div class="hud-item"><span class="hud-label">最高</span><span class="hud-value" id="bestDisplay">0</span></div>
    <div class="hud-item"><span class="hud-label">连击</span><span class="hud-value" id="comboDisplay">0</span></div>
  </div>
  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay hidden" id="overlay">
      <div class="overlay-content">
        <h2 id="resultTitle">游戏结束</h2>
        <p id="resultScore">得分: 0</p>
        <button class="btn btn-primary" id="restartBtn">再来一局</button>
      </div>
    </div>
  </div>
  <div class="control-bar">
    <button class="btn btn-primary" id="newGameBtn">新游戏</button>
  </div>
  <p class="hint">鼠标/手指移动瞄准，点击发射</p>
</div>
<script src="lib/gsap.min.js"></script>
<script src="js/bubblepop.js"></script>
</body>
</html>
