<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="css/snake.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
  <div class="hud">
    <div class="hud-item"><span class="hud-label">分数</span><span class="hud-value" id="scoreDisplay">0</span></div>
    <div class="hud-item"><span class="hud-label">最高</span><span class="hud-value" id="bestDisplay">0</span></div>
    <div class="hud-item"><span class="hud-label">长度</span><span class="hud-value" id="lengthDisplay">3</span></div>
  </div>
  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay hidden" id="overlay">
      <div class="overlay-content">
        <h2>游戏结束</h2>
        <p id="resultScore">得分: 0</p>
        <button class="btn btn-primary" id="restartBtn">再来一局</button>
      </div>
    </div>
  </div>
  <div class="control-bar">
    <button class="btn btn-secondary" id="pauseBtn">暂停</button>
    <button class="btn btn-primary" id="newGameBtn">新游戏</button>
  </div>
  <p class="hint">方向键 / 滑动控制方向</p>
  <div class="touch-controls" id="touchControls">
    <div class="touch-grid">
      <div></div>
      <button class="touch-btn" data-dir="up">▲</button>
      <div></div>
      <button class="touch-btn" data-dir="left">◀</button>
      <button class="touch-btn" data-dir="down">▼</button>
      <button class="touch-btn" data-dir="right">▶</button>
    </div>
  </div>
</div>
<script src="lib/gsap.min.js"></script>
<script src="js/snake.js"></script>
</body>
</html>
